# ==============================================================================
# 核心分发策略 (PropagationPolicies)
# ==============================================================================

# 1. 基础鉴权 Secret 全局分发策略
# 确保包含 GitHub Token / App 密钥的 Secret 同步至所有承载 Runner 的子集群
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-secret-propagation
  namespace: arc-runners
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Secret
    name: arc-github-secret
  placement:
    clusterAffinity:
      clusterNames:
      - member1
      - member2
---
# 2. 单一 Listener 及其依赖凭证定向分发策略
# 将 Listener Pod 及所需的跨集群认证 Secret、ServiceAccount 调度到指定集群 (如 member1)
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-listener-propagation
  namespace: arc-systems
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
    # 匹配 Listener Pod 名称前缀或完整名称
    name: karmada-runner-fdfdcc69-listener
  - apiVersion: v1
    kind: Secret
    name: karmada-token
  - apiVersion: v1
    kind: Secret
    name: karmada-runner-fdfdcc69-listener-config
  - apiVersion: v1
    kind: ServiceAccount
    name: karmada-runner-fdfdcc69-listener
  placement:
    clusterAffinity:
      clusterNames:
      - member1
---
# 3. 核心机制 ③：Runner Pod 跨集群分摊调度与 JIT Secret 依赖自动穿透策略
# - propagateDeps: true: Karmada 自动解析 Runner Pod 环境变量中通过 secretKeyRef
#   引用的瞬时一次性 JIT 凭据 Secret，并与 Pod 强绑定原子下发至同一集群；
# - replicaScheduling: Divided / Weighted: Karmada 调度器将并发到来的任务分摊至各成员集群。
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-runner-pod-propagation
  namespace: arc-runners
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
  propagateDeps: true
  placement:
    clusterAffinity:
      clusterNames:
      - member1
      - member2
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Weighted
